## All options defined here are available to all instances.
init_config:

instances:
  - ## @param tenable_platform - string - optional - default: tenable_io
    ## Which Tenable deployment to pull vulnerabilities from:
    ##   tenable_io - Tenable Vulnerability Management (cloud, tenable.io)
    ##   tenable_sc - Tenable Security Center (self-hosted)
    #
    tenable_platform: "tenable_io"

    ## --- Tenable.io settings (only used when tenable_platform: tenable_io) ---

    ## @param tenable_access_key - string - required for tenable_io
    ## Tenable.io API access key.
    ## Generate one under Tenable.io > Settings > My Account > API Keys.
    #
    tenable_access_key: "<TENABLE_ACCESS_KEY>"

    ## @param tenable_secret_key - string - required for tenable_io
    ## Tenable.io API secret key.
    #
    tenable_secret_key: "<TENABLE_SECRET_KEY>"

    ## --- Tenable Security Center settings (only used when tenable_platform: tenable_sc) ---

    ## @param sc_host - string - required for tenable_sc
    ## Hostname or IP of your Tenable Security Center instance.
    #
    # sc_host: "sc.internal.company.tld"

    ## @param sc_port - integer - optional - default: 443
    #
    # sc_port: 443

    ## @param sc_ssl_verify - boolean - optional - default: true
    ## Set to false if Security Center uses a self-signed certificate and you
    ## haven't installed it in the Agent's trust store. Prefer fixing the
    ## trust store over disabling verification where possible.
    #
    # sc_ssl_verify: true

    ## @param sc_access_key / sc_secret_key - string - preferred auth for tenable_sc
    ## API keys (Security Center 5.13+). Generate under
    ## My Account > Generate API Key in the Security Center UI.
    #
    # sc_access_key: "<SC_ACCESS_KEY>"
    # sc_secret_key: "<SC_SECRET_KEY>"

    ## @param sc_username / sc_password - string - fallback auth for tenable_sc
    ## Only used if sc_access_key/sc_secret_key are not set. Requires a
    ## dedicated service account with API access; avoid personal credentials.
    #
    # sc_username: "<SC_SERVICE_ACCOUNT>"
    # sc_password: "<SC_SERVICE_ACCOUNT_PASSWORD>"

    ## @param dd_api_key - string - required
    ## Datadog API key. Uses the same key configured for the Agent (datadog.yaml)
    ## if you'd rather not duplicate it here; either works.
    #
    dd_api_key: "<DD_API_KEY>"

    ## @param dd_app_key - string - required
    ## Datadog application key. Must have the security_monitoring_findings_write
    ## permission.
    #
    dd_app_key: "<DD_APP_KEY>"

    ## @param dd_site - string - optional - default: datadoghq.com
    ## Datadog site to send data to, e.g. datadoghq.com, datadoghq.eu, us3.datadoghq.com.
    #
    dd_site: "datadoghq.com"

    ## @param lookback_hours - integer - optional - default: 6
    ## On the very first run (no persistent cache yet), how far back to look
    ## for Tenable findings (last_found filter). Subsequent runs use a
    ## high-water mark saved between checks, so this only matters once.
    #
    lookback_hours: 6

    ## @param min_severities - list of strings - optional
    ## Which Tenable severities to import. Options: info, low, medium, high, critical.
    #
    min_severities:
      - low
      - medium
      - high
      - critical

    ## @param include_unlicensed - boolean - optional - default: false
    ## Include unlicensed assets in the Tenable export.
    #
    include_unlicensed: false

    ## @param scanner_name - string - optional - default: tenable.io
    ## Name reported as the scanning tool in the CycloneDX metadata.tools block.
    #
    scanner_name: "tenable.io"

    ## Run this check every 4 hours (14400s). Datadog auto-closes imported
    ## vulnerabilities after 5 hours if they aren't re-submitted, so this
    ## check must run more often than that.
    min_collection_interval: 14400
